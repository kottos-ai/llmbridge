name: Auto-close external PRs

# Closes pull requests from non-collaborators with a polite message
# pointing to CONTRIBUTING.md. Internal team PRs are unaffected.
#
# SECURITY NOTE: This workflow uses `pull_request_target`, which runs in the
# context of the target (base) repository with write permissions. This is
# REQUIRED so we can comment on and close PRs from forks.
#
# DO NOT add `actions/checkout` to this workflow, and DO NOT check out the
# PR's code or run any PR-supplied scripts. Doing so would create a privilege
# escalation vector (arbitrary PR code running with write permissions to the
# repo). The workflow as written is safe because it only reads PR metadata
# (author login, PR number) and never executes PR-supplied content.

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-external-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check author permission
        id: check-permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.pull_request.user.login,
            });
            const allowedRoles = ['admin', 'maintain', 'write'];
            return allowedRoles.includes(permission.permission);
          result-encoding: string

      - name: Comment and close
        if: steps.check-permission.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `Thanks for your interest in llmbridge!

            We do not currently accept external code contributions to this repository — please see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the full policy and rationale.

            **What you can do instead:**

            - **Found a bug?** Open an [issue](../../issues/new?template=bug_report.md) — we read every one.
            - **Want a feature?** Open a [feature request issue](../../issues/new?template=feature_request.md).
            - **Have a question?** Start a [discussion](../../discussions).
            - **Documentation typo or broken link?** Those PRs we *do* accept — please mention this in the PR description and we'll review.

            If this PR is a small documentation fix, please reopen it with a note in the description that it's a documentation-only change, and we'll review it.

            Thanks for understanding, and thanks for caring about the project enough to contribute.

            — The Kottos AI team`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed',
            });
