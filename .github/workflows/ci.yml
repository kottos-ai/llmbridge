name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and finishes in under a second: it needs no compiler and no build.
  # Guards the ep_/ur_ backend split, which is what stops a call landing in the
  # wrong event loop: the two backends' teardown and I/O are not interchangeable,
  # and one such crossing shipped undetected before this existed.
  conventions:
    name: naming conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check backend prefixes and namespaces
        run: python3 scripts/check_conventions.py
      # Cheap last line of defence, not a gitleaks replacement. `private/` (live-key
      # demo scripts, price observatory) shares this working tree with the public
      # repo, separated only by .gitignore, so one mis-added file is unrecoverable
      # once pushed.
      - name: Check no credentials are tracked
        run: python3 scripts/check_no_secrets.py

  # Pinned compiler versions, not bare `gcc`/`clang`. DESIGN.md and the README state a
  # GCC 13+ / Clang 16+ floor; testing whatever the runner image happens to ship proves
  # only that one version works, and silently drifts as the image updates. These are the
  # versions we claim, so these are the versions CI builds.
  build-test:
    name: build & test · ${{ matrix.cxx }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: g++-13,      cc: gcc-13,   cxx: g++-13 }
          - { pkg: g++-14,      cc: gcc-14,   cxx: g++-14 }
          - { pkg: clang-16,    cc: clang-16, cxx: clang++-16 }
          - { pkg: clang-17,    cc: clang-17, cxx: clang++-17 }
          - { pkg: clang-18,    cc: clang-18, cxx: clang++-18 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.pkg }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Configure (Release, tests on)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLMBRIDGE_BUILD_TESTS=ON -DLLMBRIDGE_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # macOS builds the EMBEDDABLE LIBRARY only, which is the portable half and the whole
  # "drop it into your binary" story. The gateway is Linux-only by design (epoll and
  # io_uring), so this job deliberately does not build it; that is the supported
  # boundary, not a gap. Configure succeeds because net/ feature-detects io_uring
  # instead of assuming it.
  macos-library:
    name: library · macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLMBRIDGE_BUILD_TESTS=ON -DLLMBRIDGE_WERROR=ON
      - name: Build the translator library and its tests
        run: |
          cmake --build build --target provider -j
          cmake --build build --target provider_json_test provider_translate_test \
                                 provider_sse_test provider_bijection_test -j
      - name: Test
        run: ctest --test-dir build -R "Json|Translate|Sse|Bijection" --output-on-failure

  sanitizers:
    name: tests · ASan+UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure (sanitized, TLS on)
        # LLMBRIDGE_TLS=ON here (only here) so the TLS transport + gateway pump run
        # under ASan/UBSan every push; the build-test matrix stays TLS-off to prove
        # the default build needs no OpenSSL.
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DLLMBRIDGE_BUILD_TESTS=ON
          -DLLMBRIDGE_TLS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  fuzz:
    name: fuzz parsers · libFuzzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build fuzzers (Clang)
        # LLMBRIDGE_TLS=ON so the inbound-handshake target is built; it is the first
        # surface an unauthenticated remote peer reaches.
        run: |
          cmake -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ \
            -DLLMBRIDGE_BUILD_FUZZERS=ON -DLLMBRIDGE_BUILD_TESTS=OFF -DLLMBRIDGE_TLS=ON
          cmake --build build-fuzz -j
      # -artifact_prefix sends crash/timeout/OOM reproducers to one directory so the
      # upload step below can collect them. libFuzzer requires the trailing slash and
      # the directory to exist. Without this the reproducer is written to the runner's
      # CWD and discarded when the job ends, leaving a red X and no way to reproduce
      # it, which for a randomised fuzzer means the finding is simply lost.
      - name: Prepare artifact directory
        run: mkdir -p fuzz-artifacts
      - name: Fuzz the JSON parser (60s, seeded)
        run: ./build-fuzz/bin/fuzz_json -max_total_time=60 -print_final_stats=1
             -artifact_prefix=fuzz-artifacts/ fuzz/corpus/json
      - name: Fuzz the HTTP framer (60s, seeded)
        run: ./build-fuzz/bin/fuzz_http -max_total_time=60 -print_final_stats=1
             -artifact_prefix=fuzz-artifacts/ fuzz/corpus/http
      - name: Fuzz the inbound TLS handshake (60s, seeded)
        run: ./build-fuzz/bin/fuzz_tls_server -max_total_time=60 -print_final_stats=1
             -artifact_prefix=fuzz-artifacts/ fuzz/corpus/tls
      - name: Fuzz the SSE translator (60s, seeded)
        # -max_len bounds input: fuzz_sse translates each input twice (whole +
        # chunked) to assert fragmentation-invariance, so keep units modest.
        run: ./build-fuzz/bin/fuzz_sse -max_total_time=60 -max_len=8192 -print_final_stats=1
             -artifact_prefix=fuzz-artifacts/ fuzz/corpus/sse

      # if: failure() runs only when a fuzz step above failed, and still runs even
      # though that failure aborts the rest of the job. Reproduce locally with:
      #   ./build-fuzz/bin/fuzz_json <downloaded-crash-file>
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-${{ github.run_id }}
          path: fuzz-artifacts/
          if-no-files-found: warn
          retention-days: 30

  # Builds a downstream project against an INSTALLED llmbridge, exactly as the README
  # tells a user to. Nothing else here touches the install tree; the suite builds
  # in-tree, so a broken export, a header that does not stand alone, or a renamed
  # public namespace would pass every other job and break only for the consumer.
  # v0.9.0 moved `llmbridge::json` inside an installed header; this is what would
  # have caught it.
  install-consumer:
    name: consumer · find_package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and install llmbridge
        run: |
          cmake -B build-inst -DCMAKE_BUILD_TYPE=Release -DLLMBRIDGE_BUILD_TESTS=OFF \
                -DLLMBRIDGE_WERROR=ON -DCMAKE_INSTALL_PREFIX="$PWD/_install"
          cmake --build build-inst -j
          cmake --install build-inst
      - name: Build a consumer against the install tree
        run: |
          cmake -S ci/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build build-consumer -j
      - name: Run it
        run: ./build-consumer/consumer

