<text x="82" y="261.4" font-size="11" fill="#6b7280" text-anchor="end">10,000</text>
<line x1="789.8" y1="80" x2="789.8" y2="530" stroke="#e5e7eb"/>
<line x1="90" y1="121.0" x2="860" y2="121.0" stroke="#e5e7eb"/>
<text x="789.8" y="550.0" font-size="11" fill="#6b7280" text-anchor="middle">100,000</text>
<text x="82" y="125.0" font-size="11" fill="#6b7280" text-anchor="end">100,000</text>
<text x="475.0" y="578" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">offered RPS</text>
<text x="22" y="305.0" font-size="13" fill="#111827" text-anchor="middle" transform="rotate(-90 22 305.0)" font-weight="600">achieved RPS</text>
