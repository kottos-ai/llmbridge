<text x="808.3" y="116.6" font-size="12" fill="#16a34a" text-anchor="end" font-weight="700">llmbridge ceiling ≈ 90,000 RPS</text>
<text x="486.3" y="465.8" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">LiteLLM ceiling ≈ 250 RPS</text>
