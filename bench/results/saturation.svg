<text x="82" y="397.7" font-size="11" fill="#6b7280" text-anchor="end">1,000</text>
<line x1="556.5" y1="80" x2="556.5" y2="530" stroke="#e5e7eb"/>
<line x1="90" y1="257.4" x2="860" y2="257.4" stroke="#e5e7eb"/>
