<text x="82" y="534.0" font-size="11" fill="#6b7280" text-anchor="end">100</text>
<line x1="323.3" y1="80" x2="323.3" y2="530" stroke="#e5e7eb"/>
<line x1="90" y1="393.7" x2="860" y2="393.7" stroke="#e5e7eb"/>
