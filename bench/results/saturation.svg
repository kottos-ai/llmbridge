<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="600" fill="white"/>
<text x="90" y="34" font-size="22" font-weight="700" fill="#111827">Throughput saturation — offered vs achieved RPS (1 KB requests)</text>
<text x="90" y="56" font-size="13" fill="#6b7280">Both single worker (1 thread), 1 KB requests, instant backend, log-log. On the dashed line = keeping up; below it = dropping load.</text>
